<style>
  :root {
    --bg: #f3f0e8;
    --bg-raised: #fbf9f4;
    --ink: #17150f;
    --ink-soft: #57524a;
    --ink-faint: #8c867b;
    --line: #dcd6c9;
    --accent: #d2461b;
    --accent-ink: #ffffff;
    --term-bg: #17150f;
    --term-ink: #e9e4d8;
    --term-dim: #8c867b;
    --term-green: #8fcf7a;
    --draft-bg: #ffe27a;
    --draft-ink: #2b2405;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --max: 1120px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11100d; --bg-raised: #1a1915; --ink: #ede8dc; --ink-soft: #b3ad9f;
      --ink-faint: #7d776b; --line: #2d2b25; --accent: #ff6a3d; --accent-ink: #11100d;
      --term-bg: #0a0a08; --term-ink: #e9e4d8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11100d; --bg-raised: #1a1915; --ink: #ede8dc; --ink-soft: #b3ad9f;
    --ink-faint: #7d776b; --line: #2d2b25; --accent: #ff6a3d; --accent-ink: #11100d;
    --term-bg: #0a0a08; --term-ink: #e9e4d8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
  @media (max-width: 600px) { .wrap { padding: 0 16px; } body { font-size: 16px; } }

  /* Draft banner */
  .draft {
    background: var(--draft-bg); color: var(--draft-ink);
    font: 500 13px/1.4 var(--mono); padding: 8px 16px; text-align: center;
  }

  /* Nav */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
  .logo { font: 500 14px var(--mono); text-decoration: none; letter-spacing: .02em; }
  .logo b { color: var(--accent); font-weight: 500; }
  .nav-links { display: flex; gap: 28px; align-items: center; list-style: none; }
  .nav-links a { text-decoration: none; font-size: 14px; color: var(--ink-soft); }
  .nav-links a:hover { color: var(--ink); }
  .theme-btn {
    background: none; border: 1px solid var(--line); color: var(--ink);
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 15px;
    display: grid; place-items: center;
  }
  .theme-btn:hover { border-color: var(--ink-faint); }
  @media (max-width: 760px) { .nav-links li.hide-sm { display: none; } .nav-links { gap: 18px; } }

  /* Hero */
  .hero { padding: 96px 0 88px; border-bottom: 1px solid var(--line); }
  .hero .wrap { display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: center; }
  .status {
    display: inline-flex; align-items: center; gap: 10px;
    font: 13px var(--mono); color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; margin-bottom: 28px;
  }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: #3fa34d; box-shadow: 0 0 0 4px color-mix(in srgb, #3fa34d 22%, transparent); }
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(54px, 8.5vw, 104px); line-height: .95; letter-spacing: -.02em;
  }
  h1 em { color: var(--accent); }
  .role { font: 500 15px var(--mono); color: var(--ink-soft); margin: 22px 0 18px; text-transform: uppercase; letter-spacing: .08em; }
  .tagline { font-size: 19px; color: var(--ink-soft); max-width: 34ch; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 15px var(--sans); text-decoration: none;
    padding: 12px 20px; border-radius: 8px; border: 1px solid var(--ink);
    transition: transform .15s ease, background .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.primary { background: var(--ink); color: var(--bg); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--bg-raised); }

  /* Terminal */
  .term {
    background: var(--term-bg); color: var(--term-ink);
    border-radius: 12px; font: 14px/1.7 var(--mono);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.45);
    overflow: hidden; min-width: 0;
  }
  .term-bar { display: flex; gap: 7px; padding: 12px 14px; border-bottom: 1px solid #2a2823; }
  .term-bar span { width: 11px; height: 11px; border-radius: 50%; background: #3a3832; }
  .term-bar span:first-child { background: #e0614a; }
  .term-bar span:nth-child(2) { background: #e3b341; }
  .term-bar span:nth-child(3) { background: #5bb35a; }
  .term-body { padding: 18px 20px 22px; min-height: 290px; white-space: pre-wrap; word-break: break-word; }
  .term .p { color: var(--accent); }
  .term .dim { color: var(--term-dim); }
  .term .ok { color: var(--term-green); }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--term-ink); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 900px) {
    .hero { padding: 64px 0; }
    .hero .wrap { grid-template-columns: 1fr; gap: 44px; }
  }

  /* Sections */
  section { padding: 96px 0; border-bottom: 1px solid var(--line); }
  @media (max-width: 600px) { section { padding: 64px 0; } }
  .sec-head { display: grid; grid-template-columns: 220px 1fr; gap: 32px; margin-bottom: 48px; align-items: baseline; }
  .sec-num { font: 13px var(--mono); color: var(--accent); }
  h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 5vw, 56px); line-height: 1; letter-spacing: -.01em; }
  @media (max-width: 760px) { .sec-head { grid-template-columns: 1fr; gap: 8px; margin-bottom: 32px; } }

  /* About */
  .about { display: grid; grid-template-columns: 220px 1fr; gap: 32px; }
  .about-text p { font-size: 20px; color: var(--ink-soft); max-width: 62ch; }
  .about-text p + p { margin-top: 18px; }
  .about-text strong { color: var(--ink); font-weight: 500; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 44px; }
  .fact { background: var(--bg-raised); padding: 20px 22px; }
  .fact b { display: block; font-family: var(--serif); font-weight: 400; font-size: 40px; line-height: 1; }
  .fact span { font-size: 13px; color: var(--ink-faint); font-family: var(--mono); }
  @media (max-width: 760px) { .about { grid-template-columns: 1fr; gap: 0; } .about-text p { font-size: 18px; } .fact { padding: 16px 14px; } .fact b { font-size: 30px; } }

  /* Skills */
  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
  .skill-group { border-top: 2px solid var(--ink); padding-top: 18px; }
  .skill-group h3 { font: 500 13px var(--mono); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: 13px var(--mono); padding: 5px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-raised); color: var(--ink-soft); }

  /* Projects */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
  .filter {
    font: 13px var(--mono); padding: 7px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
  }
  .filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .projects { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  @media (max-width: 820px) { .projects { grid-template-columns: 1fr; } }
  .project {
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px; display: flex; flex-direction: column; gap: 14px;
    transition: border-color .2s ease, transform .2s ease;
  }
  .project:hover { border-color: var(--ink-faint); transform: translateY(-3px); }
  .project.featured { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  @media (max-width: 820px) { .project.featured { grid-template-columns: 1fr; gap: 14px; } }
  .project-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .project-kind { font: 12px var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  .project-year { font: 12px var(--mono); color: var(--ink-faint); }
  .project h3 { font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: 1.05; }
  .project.featured h3 { font-size: 44px; }
  .project p { color: var(--ink-soft); font-size: 16px; }
  .impact { list-style: none; display: grid; gap: 6px; font-size: 15px; }
  .impact li { padding-left: 20px; position: relative; color: var(--ink-soft); }
  .impact li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .stack span { font: 12px var(--mono); color: var(--ink-faint); }
  .stack span:not(:last-child)::after { content: " /"; }
  .links { display: flex; gap: 18px; }
  .links a { font: 500 14px var(--mono); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
  .links a:hover { color: var(--accent); }
  .project.hidden { display: none; }

  /* Timeline */
  .timeline { list-style: none; }
  .tl-item { display: grid; grid-template-columns: 220px 1fr; gap: 32px; padding: 28px 0; border-top: 1px solid var(--line); }
  .tl-item:last-child { border-bottom: 1px solid var(--line); }
  .tl-when { font: 14px var(--mono); color: var(--ink-faint); }
  .tl-item h3 { font-size: 20px; font-weight: 600; }
  .tl-item h3 span { font-weight: 400; color: var(--ink-soft); }
  .tl-item p { color: var(--ink-soft); margin-top: 6px; max-width: 64ch; }
  .tl-tag { display: inline-block; font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: 4px; }
  @media (max-width: 760px) { .tl-item { grid-template-columns: 1fr; gap: 6px; } }

  /* Contact */
  .contact { text-align: left; border-bottom: none; }
  .contact h2 { font-size: clamp(48px, 9vw, 120px); line-height: .92; max-width: 12ch; }
  .contact h2 a { color: var(--accent); text-decoration: none; }
  .contact h2 a:hover { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; }
  .contact-lead { font-size: 19px; color: var(--ink-soft); max-width: 52ch; margin: 28px 0 36px; }
  .socials { display: flex; flex-wrap: wrap; gap: 12px; }
  .copy-msg { font: 13px var(--mono); color: var(--ink-faint); margin-top: 14px; min-height: 20px; }

  footer { padding: 32px 0 48px; font: 13px var(--mono); color: var(--ink-faint); }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  /* Reveal on scroll */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .cursor { animation: none; }
    html { scroll-behavior: auto; }
  }

  @media print {
    nav, .draft, .term, .filters, .theme-btn, .lang-btn { display: none !important; }
    section, .hero { padding: 32px 0; }
    .reveal { opacity: 1; transform: none; }
  }

  /* Language switch, lessons, featured columns */
  .lang-btn {
    background: none; border: 1px solid var(--line); color: var(--ink); cursor: pointer;
    font: 500 12px var(--mono); height: 34px; padding: 0 10px; border-radius: 17px;
  }
  .lang-btn:hover { border-color: var(--ink-faint); }
  .lesson { font-size: 14px !important; border-left: 2px solid var(--accent); padding-left: 12px; }
  .lesson b { font-weight: 600; color: var(--ink); }
  .project .col { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>

/* ================================================================= */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const P = PROFILE;

function pickLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl === "de" || fromUrl === "en") return fromUrl;
  try { const saved = localStorage.getItem("lang"); if (saved === "de" || saved === "en") return saved; } catch {}
  return (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en";
}

let lang = pickLang();
let firstRender = true;

function render() {
  const C = CONTENT[lang], T = UI[lang];
  document.documentElement.lang = lang;
  document.title = `${P.name} — ${C.role}`;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[el.dataset.i18n]; });
  $("langBtn").textContent = T.langBtn;
  $("langBtn").setAttribute("aria-label", T.langLabel);
  $("langBtn").title = T.langLabel;

  $("logo").innerHTML = `<b>~/</b>${esc(P.initials)}`;
  $("status").textContent = C.status;
  const parts = P.name.split(" ");
  $("name").innerHTML = `${esc(parts.slice(0, -1).join(" "))}<br><em>${esc(parts.at(-1))}</em>`;
  $("role").textContent = C.role;
  $("tagline").textContent = C.tagline;
  if (P.cvUrl) $("cvBtn").href = P.cvUrl; else $("cvBtn").style.display = "none";

  $("about-text").innerHTML = C.about.map(p => `<p>${p}</p>`).join("");
  $("facts").innerHTML = C.facts.map(f => `<div class="fact"><b>${esc(f.value)}</b><span>${esc(f.label)}</span></div>`).join("");
  $("skills-list").innerHTML = C.skills.map(g => `
    <div class="skill-group"><h3>${esc(g.group)}</h3>
      <div class="chips">${g.items.map(i => `<span class="chip">${esc(i)}</span>`).join("")}</div>
    </div>`).join("");

  const kinds = [T.all, ...new Set(C.projects.map(p => p.kind))];
  $("filters").style.display = kinds.length <= 2 ? "none" : "";
  $("filters").innerHTML = kinds.map((k, i) =>
    `<button class="filter" aria-pressed="${i === 0}" data-kind="${esc(k)}">${esc(k)}</button>`).join("");
  $("project-list").innerHTML = C.projects.map(p => {
    const code = P.repos[p.key];
    const head = `
      <div class="project-top"><span class="project-kind">${esc(p.kind)}</span><span class="project-year">${esc(p.year)}</span></div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.summary)}</p>`;
    const body = `
      <ul class="impact">${p.impact.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
      <p class="lesson"><b>${esc(T.lesson)}:</b> ${esc(p.lesson)}</p>
      <div class="stack">${p.stack.map(s => `<span>${esc(s)}</span>`).join("")}</div>
      <div class="links">${code ? `<a href="${esc(code)}" target="_blank" rel="noopener">${esc(T.code)}</a>` : ""}</div>`;
    return p.featured
      ? `<article class="project featured reveal" data-kind="${esc(p.kind)}"><div class="col">${head}</div><div class="col">${body}</div></article>`
      : `<article class="project reveal" data-kind="${esc(p.kind)}">${head}${body}</article>`;
  }).join("");

  $("timeline").innerHTML = C.timeline.map(t => `
    <li class="tl-item"><div class="tl-when">${esc(t.when)}</div>
      <div><span class="tl-tag">${esc(t.tag)}</span><h3>${esc(t.title)} <span>· ${esc(t.org)}</span></h3>${t.text ? `<p>${esc(t.text)}</p>` : ""}</div>
    </li>`).join("");

  $("contactHead").innerHTML = T.contactHead;
  $("mailLink").href = `mailto:${P.email}`;
  $("contact-lead").textContent = C.contactLead;
  $("socials").innerHTML =
    `<a class="btn primary" href="mailto:${esc(P.email)}">${esc(P.email)}</a>` +
    `<button class="btn ghost" id="copyBtn" style="cursor:pointer;color:inherit">${esc(T.copy)}</button>` +
    P.socials.map(s => `<a class="btn ghost" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("");
  $("copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(P.email); $("copyMsg").textContent = T.copied; }
    catch { $("copyMsg").textContent = P.email; }
  });
  $("copyMsg").textContent = "";
  $("foot-left").textContent = `© ${new Date().getFullYear()} ${P.name} · ${C.location}`;

  // Scroll-in animation: observe on first load; after a language switch show everything at once.
  document.querySelectorAll(".reveal").forEach(el => firstRender ? io.observe(el) : el.classList.add("in"));
  firstRender = false;
}

$("filters").addEventListener("click", (e) => {
  const btn = e.target.closest(".filter"); if (!btn) return;
  document.querySelectorAll(".filter").forEach(b => b.setAttribute("aria-pressed", b === btn));
  const k = btn.dataset.kind, isAll = btn === document.querySelector(".filter");
  document.querySelectorAll(".project").forEach(card => card.classList.toggle("hidden", !isAll && card.dataset.kind !== k));
});

$("langBtn").addEventListener("click", () => {
  lang = lang === "de" ? "en" : "de";
  try { localStorage.setItem("lang", lang); } catch {}
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
  render();
});

const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: 0.08 });

render();

// Terminal typing animation (kept in English on purpose: it imitates a shell)
const lines = [
  { t: "cmd", s: "whoami" },
  { t: "out", s: `${P.name.toLowerCase()} — machinist → software & ai` },
  { t: "cmd", s: "cat focus.txt" },
  { t: "out", s: "Python · Claude API · RAG · Agents & tool use · FastAPI · pytest" },
  { t: "cmd", s: "ls projects/" },
  { t: "out", s: "docuchat  job-match-agent  job-search-copilot" },
  { t: "cmd", s: "python -m pytest -q" },
  { t: "ok",  s: "all tests passed ✓  ready to ship" },
];
const term = $("term");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function renderLine(l, text) {
  if (l.t === "cmd") return `<span class="p">❯</span> ${esc(text)}`;
  if (l.t === "ok") return `<span class="ok">${esc(text)}</span>`;
  return `<span class="dim">${esc(text)}</span>`;
}
if (reduce) {
  term.innerHTML = lines.map(l => renderLine(l, l.s)).join("\n") + `\n<span class="p">❯</span> <span class="cursor"></span>`;
} else {
  const done = [];
  (async function type() {
    for (const l of lines) {
      if (l.t === "cmd") {
        for (let i = 1; i <= l.s.length; i++) {
          term.innerHTML = [...done, renderLine(l, l.s.slice(0, i)) + '<span class="cursor"></span>'].join("\n");
          await new Promise(r => setTimeout(r, 45 + Math.random() * 50));
        }
        await new Promise(r => setTimeout(r, 250));
      }
      done.push(renderLine(l, l.s));
      term.innerHTML = done.join("\n");
      await new Promise(r => setTimeout(r, l.t === "cmd" ? 120 : 380));
    }
    term.innerHTML = done.join("\n") + `\n<span class="p">❯</span> <span class="cursor"></span>`;
  })();
}

// Theme toggle (remembered per browser)
const root = document.documentElement;
try { const saved = localStorage.getItem("theme"); if (saved) root.dataset.theme = saved; } catch {}
$("themeBtn").addEventListener("click", () => {
  const isDark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = isDark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
});
</script>
